services:
  - type: web
    name: pedidos-qr-web
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from run import preparar_base; preparar_base()" && gunicorn run:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pedidos-qr-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: pedidos-qr-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MODO_DEMO
        value: "0"
      - key: MOSTRAR_INDICE_DEMO
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_NUMERO
        sync: false

databases:
  - name: pedidos-qr-db
    databaseName: pedidos_qr
    user: pedidos_qr
    plan: free
    region: virginia
